[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0", # webpki-roots Mozilla CA certificate bundle
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib", # zlib-rs backend for flate2 / zip / lopdf
]

[bans]
# Transitive dependencies (reqwest, rmcp, scraper, ring) currently pin differing
# major versions of base64, syn, and windows-sys outside this crate's control.
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
