[package]
name = "fast-docs"
version = "0.1.0"
edition = "2021"
description = "A blazing-fast documentation fetcher for AI coding assistants"
license = "Apache-2.0"
repository = "https://github.com/bepi64/homebrew-tap"

[dependencies]
rmcp = { version = "0.2.0", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.22"
sha2 = "0.10"
hex = "0.4"
schemars = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
