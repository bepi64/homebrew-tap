[package]
name = "fast-docs"
version = "1.0.0"
edition = "2021"
description = "A blazing-fast documentation fetcher for AI coding assistants"
license = "Apache-2.0"
repository = "https://github.com/bepi64/homebrew-tap"

[dependencies]
rmcp = { version = "3.11", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "time", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.29"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
pdf-extract = "0.12.1"
sha2 = "0.11"
hex = "0.4"
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Safe-Rust image decoding for OCR; only linked where `build.rs` enables `cfg(fast_docs_ocr)`.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
image = { version = "0.25.10", optional = true, default-features = false, features = ["png", "jpeg", "webp", "tiff", "gif"] }

[dev-dependencies]
proptest = "1.12.0"
tokio = { version = "1", features = ["net"] }

[features]
# Tesseract OCR for local images. Only takes effect on macOS Apple Silicon (see build.rs).
ocr = ["dep:image"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Panic prevention
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
# No silent suppressions
allow_attributes = "deny"
# Code hygiene
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Safety
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
# Pedantic relaxations (too noisy)
module_name_repetitions = "allow"
similar_names = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
